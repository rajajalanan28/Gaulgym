name: Keep Supabase Alive

on:
  schedule:
    # Run every Monday, Wednesday, Friday, and Sunday at 00:00 UTC (07:00 WIB)
    - cron: '0 0 * * 1,3,5,0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions page

jobs:
  ping-website:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          curl -s -X GET "https://www.gaulgym.com/api/keep-alive"
